<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Firehose</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; }
  body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  /* Fade everything out toward the bottom of the screen. */
  #feed { margin: 0 auto; padding: 40px 16px 0; max-width: 760px; height: 100%; overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 25%, transparent 95%); mask-image: linear-gradient(#000 25%, transparent 95%); }
  #list { will-change: transform; }
  .li { opacity: 1; transform-origin: 30% 50%;
    transition: opacity .5s ease, transform .6s cubic-bezier(.34,1.4,.64,1); }
  .li.enter { opacity: 0; transform: scale(.9); }
  .li a { display: block; padding: 9px 0; color: inherit; text-decoration: none; }
  .repo { font-size: 12px; color: #666; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .title { overflow-wrap: anywhere; }
  .li a:hover .title { text-decoration: underline; text-underline-offset: 3px; }
  #skeleton { transition: opacity .5s ease; }
  .sk { padding: 9px 0; transition: opacity .4s ease; }
  .sk i { display: block; height: 11px; border-radius: 4px; background: #1a1a1a; animation: pulse 1.6s ease-in-out infinite; }
  .sk i + i { height: 15px; margin-top: 6px; background: #222; }
  @keyframes pulse { 50% { opacity: .45; } }
  .corner { position: fixed; right: max(16px, calc((100% - 760px) / 2 + 16px)); z-index: 1; color: #888; font-size: 12px; text-decoration: none;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  h1.corner { top: 12px; right: auto; left: max(16px, calc((100% - 760px) / 2 + 16px)); margin: 0; font-weight: 400; color: #fff; }
  a.corner { bottom: 12px; }
  nav.corner { top: 12px; display: flex; gap: 14px; }
  nav.corner a { color: #666; text-decoration: none; }
  nav.corner a:hover, nav.corner a[aria-current="page"] { color: #fff; }
  a.corner:hover { color: #fff; }
</style>
</head>
<body>
<h1 class="corner">GitHub Firehose</h1>
<nav class="corner">
  <a href="/">Issues</a>
  <a href="/pulls">Pull requests</a>
</nav>
<div id="feed"><div id="list"><div id="skeleton"></div></div></div>
<a class="corner" href="https://github.com/ingoau/github-firehose" target="_blank" rel="noopener">source code</a>
<script>
const feed = document.getElementById("list");
// Which feed: /pulls shows pull requests, anything else shows issues.
const TYPE = location.pathname.replace(/\/+$/, "") === "/pulls" ? "pulls" : "issues";
for (const a of document.querySelectorAll("nav.corner a")) {
  if ((a.getAttribute("href") === "/pulls") === (TYPE === "pulls")) a.setAttribute("aria-current", "page");
}
const SLIDE_MS = 550;


// Loading skeleton: placeholder rows of varying width until the first issues arrive.
const skeleton = document.getElementById("skeleton");
for (let n = 0; n < 24; n++) {
  const row = document.createElement("div");
  row.className = "sk";
  row.style.animationDelay = `${n * 60}ms`;
  row.innerHTML = `<i style="width:${18 + ((n * 37) % 22)}%;animation-delay:${n * 70}ms"></i><i style="width:${45 + ((n * 53) % 45)}%;animation-delay:${n * 70}ms"></i>`;
  skeleton.append(row);
}
const seen = new Set();

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function make(i) {
  const li = document.createElement("div");
  li.className = "li";
  li.innerHTML = `<div><a href="${esc(i.url)}" target="_blank" rel="noopener">
    <div class="repo">${esc(i.repo)}</div><div class="title">${esc(i.title)}</div></a></div>`;
  return li;
}

// Drop items that have been pushed fully off the bottom of the screen.
function prune() {
  const bottom = window.innerHeight;
  for (let li = feed.lastElementChild; li && li.offsetTop > bottom; li = feed.lastElementChild) li.remove();
}

// FLIP slide: insert at the top, offset the whole list up by the new item's height,
// then glide back to 0 so everything moves down together and the new item slides in from above.
function currentOffset() {
  const t = getComputedStyle(feed).transform;
  return t && t !== "none" ? new DOMMatrixReadOnly(t).m42 : 0;
}
function push(i, animate = true) {
  const li = make(i);
  if (!animate) { feed.prepend(li); return; }
  const from = currentOffset();
  li.classList.add("enter");
  feed.prepend(li);
  const h = li.offsetHeight;
  feed.style.transition = "none";
  feed.style.transform = `translateY(${from - h}px)`;
  feed.offsetHeight; // reflow
  feed.style.transition = `transform ${SLIDE_MS}ms cubic-bezier(.25,.8,.25,1)`;
  feed.style.transform = "translateY(0)";
  li.classList.remove("enter");
  setTimeout(prune, SLIDE_MS + 50);
}

// Playback: items are replayed at their real creation times, LAG_MS behind GitHub.
// The first fetch holds ~40-50s of items, so there's always a buffer and no pauses between polls.
// When a feed is too busy to show everything (pull requests run at 10+/s), it switches to sampled
// mode instead: a small pool of the newest items, released at SAMPLE_RATE with random spacing.
const LAG_MS = 25000;
const POLL_MS = 8000;
const INTRO_GAP_MS = 150; // gap between the first screenful of issues on load
const MIN_GAP_MS = 90;    // never release two issues closer together than this
const MAX_BACKLOG = 12;   // if the tab was hidden, skip ahead rather than burst through everything
const SAMPLE_ABOVE = 6;   // items/s; busier feeds are sampled rather than replayed in full
const SAMPLE_RATE = 4;    // items/s shown in sampled mode
const SAMPLE_POOL = 100;  // newest items kept waiting in sampled mode (~25s at SAMPLE_RATE, outlasting cache + poll)
let sampled = false;

const queue = [];         // { issue, t } sorted by t (ms)
let intro = [], introTotal = 0;
let clock = null;         // playhead = clock.base + (performance.now() - clock.start)
const playhead = () => (clock?.start != null ? clock.base + (performance.now() - clock.start) : -Infinity);

function enqueue(issues) {
  // createdAt is per-second; spread issues randomly within their second.
  for (const issue of issues) queue.push({ issue, t: Date.parse(issue.createdAt) + Math.random() * 1000 });
  queue.sort((a, b) => a.t - b.t);
}

function tick() {
  if (intro.length) {
    push(intro.shift());
    skeleton.style.opacity = (intro.length / introTotal).toFixed(2);
    if (!intro.length) {
      setTimeout(() => skeleton.remove(), 600);
      clock.start = performance.now(); // start real-time playback right as the intro finishes
    }
    setTimeout(tick, INTRO_GAP_MS * (0.45 + Math.random() * 1.3));
    return;
  }
  if (sampled) {
    if (queue.length) push(queue.shift().issue);
    setTimeout(tick, queue.length ? (1000 / SAMPLE_RATE) * (0.3 + Math.random() * 1.4) : 250);
    return;
  }
  const now = playhead();
  let due = 0;
  while (due < queue.length && queue[due].t <= now) due++;
  if (due > MAX_BACKLOG) queue.splice(0, due - MAX_BACKLOG);
  if (due) {
    push(queue.shift().issue);
    setTimeout(tick, MIN_GAP_MS);
    return;
  }
  const wait = queue.length && Number.isFinite(now) ? queue[0].t - now : 250;
  setTimeout(tick, Math.max(16, Math.min(250, wait)));
}
tick();

async function poll() {
  try {
    const res = await fetch(`/latest?type=${TYPE}`, { cache: "no-store" });
    const { issues } = await res.json();
    if (issues) {
      const fresh = issues.filter((i) => !seen.has(i.id));
      for (const i of fresh) seen.add(i.id);
      if (!clock && fresh.length) {
        // First load: everything older than (newest - LAG) is history. Its newest screenful
        // becomes the intro; the rest of the batch is the playback buffer.
        const times = fresh.map((i) => Date.parse(i.createdAt));
        const newest = Math.max(...times);
        const span = (newest - Math.min(...times)) / 1000;
        sampled = fresh.length / Math.max(1, span) > SAMPLE_ABOVE;
        const cut = sampled
          ? Date.parse([...fresh].sort((a, b) => Date.parse(a.createdAt) - Date.parse(b.createdAt)).at(-SAMPLE_POOL)?.createdAt ?? newest)
          : newest - LAG_MS;
        const old = fresh.filter((i) => Date.parse(i.createdAt) <= cut)
          .sort((a, b) => Date.parse(a.createdAt) - Date.parse(b.createdAt));
        intro = old.slice(-Math.ceil(window.innerHeight / 45));
        introTotal = intro.length;
        enqueue(fresh.filter((i) => Date.parse(i.createdAt) > cut));
        clock = { base: cut, start: intro.length ? null : performance.now() };
        if (!intro.length) skeleton.remove();
      } else if (clock && sampled) {
        enqueue(fresh);
        if (queue.length > SAMPLE_POOL) queue.splice(0, queue.length - SAMPLE_POOL); // keep the newest
      } else if (clock) {
        // Drop anything that arrives after its slot has long passed (e.g. slow search indexing).
        enqueue(fresh.filter((i) => Date.parse(i.createdAt) + 1000 > playhead() - 2000));
      }
      if (seen.size > 20000) { const keep = [...seen].slice(-2000); seen.clear(); keep.forEach((k) => seen.add(k)); }
    }
  } catch {}
  setTimeout(poll, clock ? POLL_MS : 1500);
}
poll();
</script>
</body>
</html>
